<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Freight</title>
<link rel="stylesheet" href="style.css">
<script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
</head>
<body>
<div class="road"></div>

<main>
  <header>
    <h1>Night Freight</h1>
    <p class="sub">A voice game for staying awake. Headphones or speakers on.</p>
  </header>

  <section id="startCard" class="card">
    <p class="premise" id="premise"></p>
    <button id="startBtn" class="big">Start the drive</button>
    <p class="hint">Needs microphone access. Speak naturally &mdash; it listens while you talk.</p>
  </section>

  <section id="game" hidden>
    <div id="statusBar">
      <span id="dot" class="dot"></span>
      <span id="status">connecting</span>
      <span id="latency"></span>
    </div>

    <div id="script" class="script"></div>

    <div id="heard" class="heard"><span class="you">you</span><span id="heardText"></span></div>

    <div class="controls">
      <button id="micBtn" class="mic">Hold to talk</button>
      <form id="typeForm" class="typeForm">
        <input id="typeInput" placeholder="…or type what you say" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
