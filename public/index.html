<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stay Awake — a story that talks back</title>
<link rel="stylesheet" href="style.css">
<script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
</head>
<body>
<div class="road"></div>

<main>
  <header>
    <h1>Stay Awake</h1>
    <p class="sub">A story that talks back. Eyes on the road &mdash; just listen and answer out loud.</p>
  </header>

  <section id="startCard" class="card">
    <p class="pickLabel">Choose a starting point</p>
    <div id="storyList" class="storyList"></div>
    <p class="premise" id="premise"></p>

    <label class="driverToggle">
      <input type="checkbox" id="driverMode" checked>
      <span>
        <strong>Driver mode</strong>
        <em>Completely hands free. The mic stays on, so just talk. Say &ldquo;stop&rdquo; to pause and &ldquo;resume&rdquo; to carry on.</em>
      </span>
    </label>

    <button id="startBtn" class="big" disabled>Begin</button>

    <div id="savesWrap" hidden>
      <p class="pickLabel">Or carry on where you left off</p>
      <div id="saveList" class="storyList"></div>
    </div>

    <p class="hint">Needs microphone access. Nothing is scripted &mdash; the story goes where you take it.</p>
  </section>

  <section id="game" hidden>
    <div id="statusBar">
      <span id="dot" class="dot"></span>
      <span id="status">connecting</span>
      <span id="progress" class="progress"></span>
      <label class="nudgeToggle"><input type="checkbox" id="nudge" checked> nudge me</label>
      <span id="latency"></span>
    </div>

    <div class="stage">
      <div id="script" class="script"></div>
      <aside id="statePanel" class="statePanel">
        <div id="driverStats" class="driverStats" hidden></div>
        <h2>Where things stand</h2>
        <div id="sceneNow" class="sceneNow"></div>
        <div id="conditions" class="conditions"></div>
        <div id="facts" class="facts"></div>
        <h2 id="traceHead" hidden>What the game is doing <button id="traceClear" type="button">clear</button></h2>
        <div id="trace" class="trace" hidden></div>
      </aside>
    </div>

    <div id="heard" class="heard"><span id="heardText"></span></div>

    <div id="driverBar" class="driverBar" hidden>
      <span class="ear"></span>
      <span id="driverHint">Listening</span>
    </div>

    <div class="controls">
      <button id="restartBtn" class="big" hidden>Tell another one</button>
      <button id="micBtn" class="mic">Hold to talk</button>
      <form id="typeForm" class="typeForm">
        <input id="typeInput" placeholder="…or type what you say" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
  </section></main>

<script type="module" src="app.js"></script>
</body>
</html>
